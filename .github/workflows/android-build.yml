name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Optional release-signing secrets. If they are missing the build still succeeds and
      # produces UNSIGNED release artifacts (see README: "Signing").
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Report signing mode
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Signing secrets found: release artifacts will be SIGNED."
          else
            echo "Signing secrets not set: release artifacts will be UNSIGNED (this is fine for testing)."
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK (installable, for quick testing)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release AAB (for Google Play)
        run: ./gradlew bundleRelease --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect build outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab dist/app-release.aab
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/app-release-unsigned.apk
          fi
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          ls -la dist

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: dist/app-release.aab
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            dist/app-release.apk
            dist/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: dist/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
