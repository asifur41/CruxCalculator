name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test (arm64 AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
        shell: bash

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Report signing mode
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Signing secrets found: release artifacts will be SIGNED."
          else
            echo "Signing secrets not set: release artifacts will be UNSIGNED."
            echo "This is fine for CI testing, but not for Play submission."
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab dist/app-release.aab
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          ls -lh dist

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-arm64
          path: dist/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: dist/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
